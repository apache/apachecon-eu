github:
  description: "Community Over Code EU - EU edition of the flagship ASF conference"
  homepage: https://eu.communityovercode.org
  labels:
    - apache
    - community-over-code
    - conference
  features:
    # Enable issues management
    issues: true
    # Enable projects for project management boards
    projects: false
    # Enable wiki for documentation
    wiki: true

  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false

  protected_branches:

  collaborators:
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true

staging:
  profile: eu
  whoami: gh-pages
